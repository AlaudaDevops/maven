apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: maven
  title: Maven
  description: Apache Maven 的 Alauda fork，提供企业内网环境下的 Java 构建工具。在 Tekton 流水线的 Java/Maven 构建任务中作为核心构建依赖使用。
  tags:
    - tool
    - java
    - build
    - open-source-fork
  links:
    - url: https://github.com/AlaudaDevops/maven
      title: GitHub Repository
      icon: github
    - url: https://github.com/apache/maven
      title: Upstream Repository
      icon: github
  annotations:
    # github plugin
    github.com/project-slug: AlaudaDevops/maven
    # 开源组件代码仓库地址，格式：${url}/${project}/${repo}
    acp.cpaas.io/open-source-component-repo: https://github.com/apache/maven
    # 开源组件的license信息,格式 ${license}
    acp.cpaas.io/open-source-component-license: Apache
    # 开源组件的license地址,格式 ${url}/${project}/${repo}/${license-path}
    acp.cpaas.io/open-source-component-license_url: https://github.com/apache/maven/blob/master/LICENSE
    # backstage techdocs plugin — dir:../ points to the repo root from .catalog/
    backstage.io/techdocs-ref: dir:../
    acp.cpaas.io/owner: qingliu@alauda.io

    # 组件属性，区别是否部署时必带的核心组件,可选值为 core 和 plugin。
    acp.cpaas.io/functional-attributes: plugin

spec:
  type: service
  system: system:alauda-devops-system
  lifecycle: production
  owner: devops
